{% extends "base.html" %}
{% load static %}

{% block title %}Costo de Venta{% endblock %}

{% block content %}
<div class="container mt-4 col-md-8">
  
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-success">
      <i class="bi bi-calculator-fill me-2"></i> Costo de Venta
    </h3>
    <a href="{% url 'gestion_ucp' %}" class="btn btn-secondary">
      <i class="bi bi-arrow-left me-1"></i> Volver
    </a>
  </div>
  <div class="card shadow-sm border-0">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0">
        <i class="bi bi-cash-stack me-2"></i> Calculadora de Costos
      </h5>
    </div>
    <div class="card-body">
      <form id="costForm" method="post" action="{% url 'guardar_costo_venta' %}">
        {% csrf_token %}
        <input type="hidden" id="proyecto_id" name="proyecto_id" value="">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="laborCost" class="form-label fw-semibold">
              <i class="bi bi-person-workspace me-1"></i> Mano de Obra Directa "MOD"
            </label>
            <input type="number" 
                   class="form-control" 
                   id="laborCost" 
                   name="laborCost" 
                   step="0.01"
                   placeholder="0.00"
                   required>
          </div>
          
          <div class="col-md-6">
            <label for="indCost" class="form-label fw-semibold">
              <i class="bi bi-gear-fill me-1"></i> Costos Indirectos "CI"
            </label>
            <input type="number" 
                   class="form-control" 
                   id="indCost" 
                   name="indCost" 
                   step="0.01"
                   placeholder="0.00"
                   required>
          </div>
        </div>

        <hr class="my-4">
        <div class="d-flex justify-content-center gap-3 mb-4">
          <button type="button" 
                  class="btn btn-success px-5" 
                  onclick="calculateCost()">
            <i class="bi bi-calculator me-1"></i> Calcular
          </button>
          <button type="reset" 
                  class="btn btn-secondary px-5">
            <i class="bi bi-arrow-counterclockwise me-1"></i> Limpiar
          </button>
        </div>
        <h5 class="text-success mb-3">
          <i class="bi bi-graph-up-arrow me-2"></i> Resultados Calculados
        </h5>
        
        <div class="row g-3">
          <div class="col-md-6">
            <label for="varCost" class="form-label fw-semibold text-primary">
              Variación 30%
            </label>
            <input type="number" 
                   class="form-control text-primary fw-bold text-center" 
                   id="varCost" 
                   name="varCost" 
                   readonly>
          </div>
          
          <div class="col-md-6">
            <label for="unitCost" class="form-label fw-semibold text-primary">
              Costo Unitario
            </label>
            <input type="number" 
                   class="form-control text-primary fw-bold text-center" 
                   id="unitCost" 
                   name="unitCost" 
                   readonly>
          </div>
          
          <div class="col-md-6">
            <label for="rateCIF" class="form-label fw-semibold text-primary">
              Tasa CIF %
            </label>
            <input type="number" 
                   class="form-control text-primary fw-bold text-center" 
                   id="rateCIF" 
                   name="rateCIF" 
                   readonly>
          </div>
          
          <div class="col-md-6">
            <label for="CIF" class="form-label fw-semibold text-primary">
              Valor Correspondiente al CIF
            </label>
            <input type="number" 
                   class="form-control text-primary fw-bold text-center" 
                   id="CIF" 
                   name="CIF" 
                   readonly>
          </div>
        </div>

        <hr class="my-4">
        <div class="alert alert-success text-center" role="alert">
          <label for="saleCost" class="form-label fw-bold fs-5 mb-2">
            <i class="bi bi-currency-dollar me-1"></i> Costo de Venta Final
          </label>
          <input type="number" 
                 class="form-control form-control-lg text-success fw-bold text-center fs-4" 
                 id="saleCost" 
                 name="saleCost" 
                 readonly>
        </div>
        <div class="d-flex justify-content-center gap-3 mt-3">
          <button type="submit" class="btn btn-primary px-5">
            <i class="bi bi-save me-1"></i> Guardar
          </button>
          <a href="{% url 'lista_proyectos' %}" class="btn btn-outline-secondary px-5">
            <i class="bi bi-x-circle me-1"></i> Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    // Prefill MOD (laborCost) from query param 'mod' if provided
    const params = new URLSearchParams(window.location.search);
    const modParam = params.get('mod');
    const ciParam = params.get('ci');
    const proyectoIdParam = params.get('proyecto_id');
    if (modParam !== null) {
        const laborInput = document.getElementById('laborCost');
        if (laborInput) {
            const modValue = parseFloat(modParam);
            if (!isNaN(modValue)) {
                laborInput.value = modValue.toFixed(2);
            }
        }
    }
    // Prefill CI (indCost) from query param 'ci' if provided
    if (ciParam !== null) {
        const indInput = document.getElementById('indCost');
        if (indInput) {
            const ciValue = parseFloat(ciParam);
            if (!isNaN(ciValue)) {
                indInput.value = ciValue.toFixed(2);
            }
        }
    }
    // Set project id hidden field if provided
    if (proyectoIdParam) {
        const pid = document.getElementById('proyecto_id');
        if (pid) pid.value = proyectoIdParam;
    }
    // Si recibimos parámetros, ejecutar cálculo automáticamente
    if (modParam !== null || ciParam !== null) {
        calculateCost();
    }
});
function calculateCost() {
    // Obtener valores de los campos existentes
    var laborCost = parseFloat(document.getElementById('laborCost').value) || 0;
    var indCost = parseFloat(document.getElementById('indCost').value) || 0;
    
    // Calcular varCost, unitCost, y rateCIF
    var varCost = laborCost * 0.3;
    var unitCost = laborCost + varCost;
    // Tasa CIF como porcentaje de MOD
    var rateCIF = laborCost > 0 ? (indCost / laborCost) * 100 : 0;
    
    // Asignar valores calculados a los campos correspondientes
    document.getElementById('varCost').value = varCost.toFixed(2);
    document.getElementById('unitCost').value = unitCost.toFixed(2);
    document.getElementById('rateCIF').value = rateCIF.toFixed(2);

    // Calcular el CIF y el costo de venta
    var CIF = unitCost * (rateCIF/100);
    var saleCost = CIF + unitCost;

    document.getElementById('CIF').value = CIF.toFixed(2);
    document.getElementById('saleCost').value = saleCost.toFixed(2);
}
</script>
{% endblock %}
