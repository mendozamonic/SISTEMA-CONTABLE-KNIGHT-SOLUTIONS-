{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 col-md-6 text-center">
  <div class="card shadow border-0">
    <div class="card-header bg-danger text-white">
      <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill"></i> Confirmar eliminación</h5>
    </div>
    <div class="card-body">
      <p class="fs-5">
        ¿Estás seguro de que deseas eliminar al empleado<br>
        <strong class="text-danger">"{{ empleado.nombre }}"</strong>?
      </p>
      <p class="text-muted">Esta acción no se puede deshacer.</p>

      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">
          <i class="bi bi-trash-fill me-1"></i> Eliminar
        </button>
        <a href="{% url 'lista_empleados' %}" class="btn btn-secondary px-4">
          <i class="bi bi-arrow-left"></i> Cancelar
        </a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
