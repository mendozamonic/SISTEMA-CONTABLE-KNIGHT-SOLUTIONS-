{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .calculator-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
    }
    
    .section-header {
        background-color: #212529;
        color: white;
        padding: 15px;
        font-weight: bold;
        margin-bottom: 20px;
        border-radius: 5px 5px 0 0;
    }
    
    .btn-accion {
        background-color: #212529;
        color: white;
    }
    
    .btn-accion:hover {
        background-color: #424649;
        color: white;
    }
    
    .cost-item {
        background-color: #f8f9fa;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 5px;
        border: 1px solid #dee2e6;
    }
</style>

<div class="calculator-container">
    <h2 class="text-center mb-4"> Costos Indirectos del Proyecto</h2>
    
    <!-- Formulario para agregar costos -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="d-flex gap-3">
                <div class="flex-grow-1">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="descripcionCosto" class="form-label fw-bold">Descripción del Costo</label>
                            <input type="text" class="form-control" id="descripcionCosto" placeholder="Descripción del costo">
                        </div>
                        <div class="col-md-6">
                            <label for="montoCosto" class="form-label fw-bold">Costo en USD</label>
                            <input type="number" class="form-control" id="montoCosto" placeholder="Costo en USD" step="0.01" min="0">
                        </div>
                    </div>
                </div>
                <div class="d-flex flex-column gap-2 align-items-start">
                    <button type="button" class="btn btn-accion btn-sm" onclick="agregarCosto()">
                        Agregar Costo
                    </button>
                    <button type="button" class="btn btn-accion btn-sm" onclick="resetearCostos()">
                        Resetear Costos
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Resumen de Costos Indirectos -->
    <div class="card shadow-sm">
        <div class="section-header">
            Resumen de Costos Indirectos
        </div>
        <div class="card-body">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr>
                        <th style="width: 70%;">Descripción</th>
                        <th style="width: 25%;">Costo</th>
                        <th style="width: 5%;"></th>
                    </tr>
                </thead>
                <tbody id="tablaCostos">
                    <tr>
                        <td colspan="3" class="text-center text-muted">No hay costos agregados</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="table-info fw-bold">
                        <td>Total de Costos Indirectos</td>
                        <td id="totalCostos">$0.00</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<script>
    // Array para almacenar los costos
    let costos = [];
    
    // Función para agregar un costo
    function agregarCosto() {
        const descripcion = document.getElementById('descripcionCosto').value.trim();
        const monto = parseFloat(document.getElementById('montoCosto').value) || 0;
        
        // Validar que se haya ingresado descripción y monto
        if (descripcion === '') {
            alert('Por favor ingrese una descripción del costo');
            return;
        }
        
        if (monto <= 0) {
            alert('Por favor ingrese un monto válido mayor a 0');
            return;
        }
        
        // Agregar el costo al array
        costos.push({
            descripcion: descripcion,
            monto: monto
        });
        
        // Limpiar los campos
        document.getElementById('descripcionCosto').value = '';
        document.getElementById('montoCosto').value = '';
        
        // Actualizar la tabla
        actualizarTabla();
    }
    
    // Función para eliminar un costo
    function eliminarCosto(index) {
        costos.splice(index, 1);
        actualizarTabla();
    }
    
    // Función para resetear todos los costos
    function resetearCostos() {
        if (costos.length === 0) {
            alert('No hay costos para resetear');
            return;
        }
        
        if (confirm('¿Está seguro de que desea eliminar todos los costos?')) {
            costos = [];
            actualizarTabla();
        }
    }
    
    // Función para actualizar la tabla de costos
    function actualizarTabla() {
        const tbody = document.getElementById('tablaCostos');
        tbody.innerHTML = '';
        
        if (costos.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No hay costos agregados</td></tr>';
            document.getElementById('totalCostos').textContent = '$0.00';
            return;
        }
        
        let total = 0;
        
        costos.forEach((costo, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${costo.descripcion}</td>
                <td>$${costo.monto.toFixed(2)}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-danger" onclick="eliminarCosto(${index})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(row);
            total += costo.monto;
        });
        
        document.getElementById('totalCostos').textContent = '$' + total.toFixed(2);
    }
    
    // Permitir agregar costo con Enter
    document.getElementById('montoCosto').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            agregarCosto();
        }
    });
    
    document.getElementById('descripcionCosto').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('montoCosto').focus();
        }
    });
</script>
{% endblock %}
