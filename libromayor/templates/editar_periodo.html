{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 col-md-6">
  <h2>{{ periodo|default:"Nuevo Período Contable" }}</h2>
  <form method="POST" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'periodo_contable' %}" class="btn btn-secondary">Volver</a>
  </form>
</div>
{% endblock %}
