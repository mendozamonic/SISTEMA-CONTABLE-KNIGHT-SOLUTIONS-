{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 col-md-6 text-center">
  <h4>¿Eliminar "{{ costo.nombre }}"?</h4>
  <p>Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'lista_costos_indirectos' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
