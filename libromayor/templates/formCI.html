{% extends 'base.html' %}
{% block content %}
<div class="container mt-4 col-md-6">
  <h3>{{ accion }} costo indirecto</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mt-3">
      <button type="submit" class="btn btn-success">Guardar</button>
      <a href="{% url 'lista_costos_indirectos' %}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
