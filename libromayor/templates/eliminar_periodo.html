{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 col-md-6">
  <h4>¿Seguro que desea eliminar el período "{{ periodo.nombre }}"?</h4>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'periodo_contable' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
